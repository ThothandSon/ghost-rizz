version: 2

project_name: ghost-rizz

before:
  hooks:
    - go mod tidy

builds:
  - id: ghost-rizz
    main: ./cmd/ghost-rizz/
    binary: ghost-rizz
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

universal_binaries:
  - id: ghost-rizz
    replace: true

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: ThothandSon
    name: ghost-rizz
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
